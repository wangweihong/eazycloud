#user www-data;
user root;
worker_processes auto;
pid /run/nginx.pid;

events {
        worker_connections 768;
        # multi_accept on;
}

http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Logging Settings
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        server {
                listen 8080;
                server_name localhost;
                location / {
                        root /etc/nginx/dist;
                        index index.html index.htm;
                        try_files $uri $uri/ /index.html;
                }

                location /v1 {
                        proxy_pass http://127.0.0.1:12346/v1;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
                location /download {
                        proxy_pass http://127.0.0.1:12346/download;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
                location /secure {
                        proxy_pass http://127.0.0.1:12346/secure;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
                location /s {
                        proxy_pass http://127.0.0.1:12346/s;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
        }

        server {
                listen 8081;
                server_name localhost;
                location / {
                        root /etc/nginx/dist;
                        index index.html index.htm;
                        try_files $uri $uri/ /index.html;
                }

                location /v1/content/get/share/link {
                        proxy_pass http://127.0.0.1:12346/v1/content/get/share/link;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
                location /v1/anonymous {
                        proxy_pass http://127.0.0.1:12346/v1/anonymous;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
                location /download {
                        proxy_pass http://127.0.0.1:12346/download;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
                location /secure {
                        proxy_pass http://127.0.0.1:12346/secure;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
                location /s {
                        proxy_pass http://127.0.0.1:12346/s;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
                location /v1/space/list {
                        proxy_pass http://127.0.0.1:12346/v1/space/list;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
        }
        server {
                listen 443 ssl;
                server_name localhost;
                ssl_certificate         /var/lib/thci/pki/app.pem;
                ssl_certificate_key     /var/lib/thci/pki/app-key.pem;
                proxy_set_header Remote_addr $remote_addr;
                location / {
                        root /etc/nginx/dist;
                        index index.html index.htm;
                        try_files $uri $uri/ /index.html;
                }

                location /v1 {
                        proxy_pass http://127.0.0.1:12346/v1;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
                location /download {
                        proxy_pass http://127.0.0.1:12346/download;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
                location /secure {
                        proxy_pass http://127.0.0.1:12346/secure;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
                location /s {
                        proxy_pass http://127.0.0.1:12346/s;
                        proxy_read_timeout 100000s;
                        client_max_body_size 2000m;
                }
        }
}
